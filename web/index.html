<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Context Admin</title>
<link rel="stylesheet" href="./main.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M9 13a4.5 4.5 0 0 0 3-4"/><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M6 18a4 4 0 0 1-1.967-.516"/><path d="M12 13h4"/><path d="M12 18h6a2 2 0 0 1 2 2v1"/><path d="M12 8h8"/><path d="M16 8V5a2 2 0 0 1 2-2"/><circle cx="16" cy="13" r=".6"/><circle cx="18" cy="3" r=".6"/><circle cx="20" cy="21" r=".6"/><circle cx="20" cy="8" r=".6"/></svg></i><b>Claude Context Admin</b></div>
    <div class="sscroll">
    <nav class="nav" id="nav">
      <button data-v="all" aria-current="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="14" height="3" rx="1"/><rect x="3" y="9" width="14" height="3" rx="1"/><rect x="3" y="14" width="9" height="3" rx="1"/></svg>Memories</button>
      <button data-v="review"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10.5l3.5 3.5L16 5.5"/></svg>Review<span class="badge" id="rvcount"></span></button>
      <button data-v="map"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="5" cy="6" r="2"/><circle cx="15" cy="5" r="2"/><circle cx="10" cy="15" r="2"/><path d="M6.7 7.2l2.4 6M13.3 6.4l-2.4 6.8M7 6l6-1"/></svg>Map</button>
      <button data-v="activity"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 5v5l3 2"/><circle cx="10" cy="10" r="7"/></svg>Activity</button>
      <button data-v="ins"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3h7l3 3v11H5z"/><path d="M8 9h5M8 12h5"/></svg>Instructions</button>
    </nav>
<div class="sect">Toolkit</div><nav class="nav" id="nav2"><button data-v="what"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h14M5 15V9M9 15V5M13 15v-4M17 15V7"/></svg>What loads here</button><button data-v="plugins"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3M12 3v3M6 6h8v4a4 4 0 0 1-8 0zM10 14v3"/></svg>Plugins<span class="cnt" id="c-plugins"></span></button><button data-v="mcp"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="5" rx="1.5"/><rect x="3" y="11" width="14" height="5" rx="1.5"/><path d="M6 6.5h.01M6 13.5h.01"/></svg>MCP servers<span class="cnt" id="c-mcp"></span></button><button data-v="skills"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3L5 11h5l-1 6 6-8h-5z"/></svg>Skills &amp; commands<span class="cnt" id="c-skills"></span></button><button data-v="agents"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="3"/><path d="M4 17a6 6 0 0 1 12 0"/></svg>Agents<span class="cnt" id="c-agents"></span></button><button data-v="hooks"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v7a3 3 0 1 1-3-3"/><path d="M10 3l3 3"/></svg>Hooks<span class="cnt" id="c-hooks"></span></button></nav>
    <div id="projs"></div>
    </div>
    <div class="foot"><span class="live"></span><span id="watch">Watching ~/.claude</span>
      <button class="gear" id="gear" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg></button>
    </div>
  </aside>

  <main class="main">
    <div class="mobilebar" id="mnav"></div>
    <div class="top">
      <div><div class="ttl"><span class="navb"><button id="navback" aria-label="Back" title="Back (⌘[)" disabled><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button><button id="navfwd" aria-label="Forward" title="Forward (⌘])" disabled><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button></span><h1 id="h1">All memories</h1><span id="scope"></span></div><div class="sub" id="sub"></div></div>
      <button class="btn" id="newmem">+ New memory</button><button class="btn" id="addbtn" hidden>+ Add</button><div class="hacts" id="hacts"></div>
      <label class="search" id="searchwrap"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--faint)"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg><input id="q" type="search" placeholder="Filter · ⌘K searches all" aria-label="Filter memories"></label>
    </div>
    <div class="chips" id="chips"></div>
    <section class="view" id="v-all"></section>
    <section class="view" id="v-review" hidden></section>
    <section class="view" id="v-map" hidden><div id="mapempty"></div><div class="map" id="map"><svg id="msvg"></svg><div class="tip" id="tip" hidden></div>
      <div class="maptools" role="group" aria-label="Zoom"><button id="mzin" aria-label="Zoom in" title="Zoom in">+</button><button id="mzout" aria-label="Zoom out" title="Zoom out">−</button><button id="mreset" aria-label="Fit everything" title="Fit everything"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button></div>
      <div class="maplegend"><span>Each dot is one memory. Bigger means more connections.</span><span>Hover to preview, click to open. Scroll to zoom.</span></div></div></section>
    <section class="view" id="v-ins" hidden></section><section class="view" id="v-activity" hidden></section><section class="view" id="v-what" hidden></section><section class="view" id="v-plugins" hidden></section><section class="view" id="v-mcp" hidden></section><section class="view" id="v-skills" hidden></section><section class="view" id="v-agents" hidden></section><section class="view" id="v-hooks" hidden></section>
  </main>

  <aside class="drawer" id="drawer" aria-label="Memory details"></aside>
  <div class="toast" id="toast"><span id="tmsg"></span><button id="tundo">Undo</button></div>
</div>
  <div class="settings" id="setpop" role="dialog" aria-label="Settings" hidden>
    <div class="sect">Theme</div>
    <div class="theme" role="group" aria-label="Theme"><button data-th="">System</button><button data-th="light">Light</button><button data-th="dark">Dark</button></div>
    <div class="sect">Accent</div>
    <div class="accents" role="group" aria-label="Accent color"><button style="--h:290" data-h="290" aria-label="Violet"></button><button style="--h:260" data-h="260" aria-label="Indigo"></button><button style="--h:235" data-h="235" aria-label="Blue"></button><button style="--h:180" data-h="180" aria-label="Teal"></button><button style="--h:70" data-h="70" aria-label="Amber"></button><button style="--h:10" data-h="10" aria-label="Rose"></button></div>
    <div class="sect">Claude</div>
    <div class="hint" id="plugstat"></div>
  </div>
<script type="module" src="./main.js"></script>
</body>
</html>
