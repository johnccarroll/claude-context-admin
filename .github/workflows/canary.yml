name: canary

# Every day against the newest Claude Code: catches a release that changes what cca reads
# before users notice. A failed scheduled run emails the repo owner.
on:
  schedule:
    - cron: "17 13 * * *" # 09:17 US Eastern (EDT)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read # read-only token: CI never writes to the repo

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install the latest Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: cca doctor against it
        run: scripts/canary.sh
