name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read # read-only token: CI never writes to the repo

jobs:
  test:
    runs-on: ubuntu-latest # Linux bills 1x; a run takes about 3 minutes
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Build UI
        run: cd web && bun install --frozen-lockfile && bun run build
      - name: Check
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          cd web && bunx tsc --noEmit
      - name: Linux smoke (serve, freedesktop Trash, undo)
        run: go build -o cca ./cmd/cca && scripts/linux-smoke.sh
