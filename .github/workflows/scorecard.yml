name: scorecard

# OpenSSF Scorecard: an independent score of this repo's supply-chain practices (pinned actions,
# branch protection, token permissions, signed releases...). Results are public at
# scorecard.dev and feed the repo's code scanning alerts.
on:
  branch_protection_rule:
  schedule:
    - cron: "41 12 * * 1" # Mondays
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest # Linux bills 1x; a run takes under a minute
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write # upload the results to code scanning
      id-token: write # prove to scorecard.dev that the results come from this repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
